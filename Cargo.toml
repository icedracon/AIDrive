[workspace]
members = ["apps/api", "apps/mcp-server", "apps/db-tool"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/icedracon/AIDrive"
homepage = "https://github.com/icedracon/AIDrive"
authors = ["icedracon"]

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.44", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "=3.10.0", features = ["macros", "server", "transport-io"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
