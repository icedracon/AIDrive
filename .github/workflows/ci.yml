name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# aidrive-api downloads its bundled PostgreSQL from GitHub at build time;
# the read-only token avoids the anonymous API rate limit.
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Unit tests only; the live database flows are #[ignore] and run in the database job.
      - run: cargo test --locked --workspace

  msrv:
    # The workspace declares rust-version 1.92; this job is the only check of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  database:
    # scripts/db-check.sh and scripts/api-check.sh each start a private
    # PostgreSQL 17 cluster (C.UTF-8, so Armenian case folding works) and
    # run every migration, db/tests/*.sql suite and live API flow, including
    # the memory evaluation on eval/dev.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIDRIVE_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17
      - run: cargo build --locked -p aidrive-db
      - run: bash scripts/db-check.sh
      - run: bash scripts/api-check.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
