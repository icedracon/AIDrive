name: Release

# Builds aidrive-api (with the embedded PostgreSQL 17 bundled) and
# aidrive-mcp-server for each platform and attaches them to a draft GitHub
# release. Runs only when a v* tag is pushed; nothing is published to crates.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      # First-party actions only (SECURITY-REVIEW-2026-11 F4). The checkout
      # token is not left in .git/config, where every build script could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      # No cache: a release must not reuse artefacts written by branch builds.
      # The token is read-only (workflow default) and only lets the
      # postgresql_embedded build download avoid GitHub's anonymous rate limit.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p aidrive-api -p aidrive-mcp-server
      - name: Package
        shell: bash
        run: |
          name="aidrive-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/aidrive-api$ext" "target/${{ matrix.target }}/release/aidrive-mcp-server$ext" "$name/"
          cp README.md LICENSE-APACHE LICENSE-MIT THIRD-PARTY-NOTICES.md "$name/"
          if [[ -n "$ext" ]]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The write token goes only to the preinstalled gh CLI, never to a
      # third-party action.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
