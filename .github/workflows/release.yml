name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Source checks
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -I -B scripts/test-bundle-release.py
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build complete release folder
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          bash scripts/package-release.sh
          (cd apps/web && npm run lint && npx tsc --noEmit && npm test)
      - name: Verify and bundle installers with payload
        shell: bash
        run: python scripts/bundle-release.py --dist dist --platform "${{ matrix.platform }}" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/AIDrive-setup-*.zip
            dist/AIDrive-setup-*.tar.gz
            dist/BUILD-*.json

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum AIDrive-setup-* BUILD-*.json > SHA256SUMS
      - name: Draft experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' 'Experimental source preview packaged for Windows x64 and Linux x64.' '' 'Download the setup archive for your platform, extract it, open a terminal in your project folder, then run the installer inside AIDrive/.' '' 'Includes the web UI and bundled PostgreSQL. SHA256SUMS covers downloads; BUILD files identify the source commit.' '' 'Clean-machine pilot acceptance remains open. Idle Codex wake is not supported by the current integration.' > release-notes.txt
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag --title "AIDrive $GITHUB_REF_NAME — experimental preview" --notes-file release-notes.txt
