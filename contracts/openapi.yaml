      - content
      properties:
        request_id:
          type: string
          format: uuid
        base_version_id:
          type: string
          format: uuid
        content:
          type: string
          description: Exact UTF-8 text, no NUL; at most 262144 bytes (not characters).
    RestoreTextFile:
      type: object
      additionalProperties: false
      required:
      - request_id
      - base_version_id
      - source_version_id
      properties:
        request_id:
          type: string
          format: uuid
        base_version_id:
          type: string
          format: uuid
        source_version_id:
          type: string
          format: uuid
    AgentGrant:
      type: object
      required: [id, name, scope, created_at, expires_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: ["workspace:read", "files:read", "files:write"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, expired, revoked, issuer_unavailable] }
    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces: { type: array, items: { $ref: "#/components/schemas/Workspace" } }
    WorkspaceBody:
      type: object
      required: [workspace]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 15, maxLength: 256 }
    Session:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Check:
      type: string
      enum: [ok, failed, not_configured, skipped]
    Readiness:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: aidrive-api
        checks:
          type: object
          required: [database, role, schema]
          properties:
            database: { $ref: "#/components/schemas/Check" }
            role: { $ref: "#/components/schemas/Check" }
            schema: { $ref: "#/components/schemas/Check" }
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: aidrive-api
