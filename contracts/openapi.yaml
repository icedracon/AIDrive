              $ref: '#/components/schemas/CreateTextFile'
  /agent/workspaces/{id}/files/{file}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: file
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: agentReadFile
      summary: ReadFile
      description: 'Bearer-only; cookies are ignored. Requires files:read or higher. '
      security:
      - agentBearer: []
      responses:
        '200':
          description: Result; Cache-Control no-store and X-Content-Type-Options nosniff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
        '401':
          description: Invalid or missing credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope, read-only membership or failed CSRF check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or unauthorized workspace/file/version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable; a write may have committed. Retry the identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: agentEditTextFile
      summary: EditTextFile
      description: Bearer-only; cookies are ignored. Requires files:write.  A request UUID deduplicates retries. Same
        UUID and same input returns the original version without moving the head; different input returns request_conflict.
        Inspect current_version_id before editing a replayed result. Requires base_version_id matching current head;
        stale base returns version_conflict. Restore copies a source from this file into a new version.
      security:
      - agentBearer: []
      responses:
        '200':
          description: Result; Cache-Control no-store and X-Content-Type-Options nosniff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
        '401':
          description: Invalid or missing credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope, read-only membership or failed CSRF check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or unauthorized workspace/file/version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable; a write may have committed. Retry the identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: version_conflict or request_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content above 256 KiB, or request body above the framework 2 MiB JSON limit
        '422':
          description: Invalid filename, UUID, text, or unsupported fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTextFile'
  /agent/workspaces/{id}/files/{file}/versions:
