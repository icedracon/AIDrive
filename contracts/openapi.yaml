      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: file
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: humanDownloadFileVersion
      summary: DownloadFileVersion
      description: Human session required; viewer or higher.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Exact saved UTF-8 text as attachment; filename uses UTF-8 percent encoding, never HTML rendering.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Invalid or missing credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope, read-only membership or failed CSRF check
          content:
            application/json:
