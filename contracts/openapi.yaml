  /workspaces/{id}/handoffs:
    get:
      operationId: listHandoffs
      summary: Recent handoffs with exact sources and computed staleness (viewer or higher; also /agent/... with files:read)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ handoffs: Handoff[] } — each with status proposed|approved|rejected|superseded, stale, sources[]" }
    post:
      operationId: recordHandoff
      summary: Record a proposed handoff (editor/owner session, or /agent/... with files:write). Content is immutable.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Proposed handoff with agent_id when recorded by an agent }
        "403": { description: read_only or insufficient_scope }
        "409": { description: request_conflict (request ID reused with different input) }
        "422": { description: invalid_handoff, unknown_source or duplicate_source }
  /workspaces/{id}/handoffs/latest:
    get:
      operationId: latestHandoff
      summary: "{ approved: Handoff|null, pending: Handoff[] } — the approved handoff (flagged stale if a cited file changed) and unapproved proposals. Also /agent/..."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Latest state }
  /workspaces/{id}/handoffs/{handoff}/decision:
    post:
      operationId: decideHandoff
      summary: Owner approves or rejects a proposed handoff. Session only; no agent route. Approval locks cited files and requires them unchanged; it supersedes the previous approval. Also /agent/... with a review:accept key (handoffs by other actors only) or a grand key; 403 otherwise.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: handoff, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Decided handoff }
        "403": { description: owner_required }
        "409": { description: stale_sources or already_decided }
  /workspaces/{id}/activity:
    get:
      operationId: workspaceActivity
      summary: "Timeline derived from file actions, handoffs and agent keys, newest first: { events: [{ at, kind, actor_email, agent_id, agent_name, subject, file_id, version_id, revision, handoff_id }], next_before }. Viewer or higher; also /agent/... with files:read."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: before, in: query, required: false, schema: { type: string, description: "next_before cursor (RFC 3339, microseconds, UTC)" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: "kind is file.create|file.update|file.restore|handoff.proposed|handoff.approved|handoff.rejected|agent.issued|agent.revoked" }
        "403": { description: insufficient_scope (agent key below files:read) }
        "404": { description: Not a member }
        "422": { description: invalid_cursor }
  /agent/pairing:
    post:
      operationId: startPairing
      summary: "Unauthenticated. Body { pairing_id (uuid), client_name, token_sha256 (64 hex) }; the client keeps the secret. Returns { user_code (8 consonants), verification_url, expires_in: 600 }. Same ID and hash replays the same code."
      responses:
        "201": { description: Pairing started }
        "409": { description: already_used }
        "422": { description: invalid_request }
        "429": { description: too_many_attempts (global cap on live pending requests) }
  /agent/pairing/{id}/status:
    post:
      operationId: pairingStatus
      summary: "Bearer = the client's own secret. { status: pending|approved|denied|expired, workspace_id, workspace_name, scope, approver_email }. Unknown ID or wrong secret: 404."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Status }
        "404": { description: not_found }
  /pairing/{code}:
    get:
      operationId: lookupPairing
      summary: "Session. { client_name, status, expires_at }. Unknown or expired codes count as failed attempts; ten in ten minutes returns 429."
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Pending request }
        "404": { description: not_found }
        "429": { description: too_many_attempts }
  /pairing/{code}/decision:
    post:
      operationId: decidePairing
      summary: "Session + same-origin. { decision: approved|denied, workspace_id, scope }. Approval issues an ordinary agent grant for the client's hash in a space the caller owns."
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ status, agent_id }" }
        "403": { description: owner_required }
        "404": { description: not_found }
        "409": { description: already_used }
        "429": { description: too_many_attempts }
  /workspaces/{id}/sessions:
    get:
      operationId: listSessions
      summary: "Captured sessions the caller can see, newest first: [{ id, client (claude-code|codex), label, capture_origin (import|hook), coverage (complete|partial), agent_id, started_at, ended_at, event_count, visibility (private|team), mine }]. private sessions are visible only to the person who captured them and the assistants acting for that person; workspace owners do not see other people's private sessions. Viewer or higher; also /agent/... with files:read."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses:
        "200": { description: Sessions }
    post:
      operationId: upsertSession
      summary: "Create or merge a captured session { client, external_id, label, origin, started_at?, ended_at? } -> { session_id }. New sessions are private. Editor/owner or files:write agent; the same person's same (client, external_id) merges bounds; another person's session with that id is refused (409 session_belongs_to_another_person)."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ session_id }" }
        "403": { description: read_only or insufficient_scope }
        "409": { description: session_belongs_to_another_person }
        "422": { description: invalid_session }
  /workspaces/{id}/sessions/search:
    get:
      operationId: searchSessions
      summary: "Full-text search over captured events the caller can see ('simple' configuration). A plain question is planned: English and Armenian stopwords dropped, light suffix normalisation, 3+ character terms as prefixes, sources matching more terms first, and a matched user question is followed by its answer (the next assistant event). Text with quoted phrases or -exclusions uses websearch syntax (any term may match; exclusions stay ANDed). [{ session_id, client, label, ordinal, role, at, snippet (matches wrapped in «»), rank }]."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses:
        "200": { description: Ranked hits }
        "422": { description: invalid_query }
  /workspaces/{id}/sessions/{session}/events:
    get:
      operationId: sessionExcerpt
      summary: "Events around an ordinal: ?around=N&radius=R (R <= 20) -> [{ ordinal, role, at, text }]"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: session, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Events }
        "404": { description: not_found }
    post:
      operationId: addSessionEvents
      summary: "Append up to 500 events { events: [{ key, ordinal, role: user|assistant|tool, at?, text (1-4000 chars) }], complete }. Idempotent by key; returns { inserted }."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: session, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ inserted }" }
        "422": { description: invalid_session }
  /workspaces/{id}/sessions/{session}:
    delete:
      operationId: deleteSession
      summary: A workspace owner or the person who captured it (session only); removes the session, its events and search entries. No agent route.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: session, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "403": { description: owner_required }
        "404": { description: not_found }
  /workspaces/{id}/knowledge:
    get:
      operationId: listKnowledge
      summary: "Project knowledge with evidence: [{ id, kind, topic, statement, outcome, status (proposed|approved|rejected|superseded|retired), supersedes, actor_id, agent_id, decided_at, decision_note, created_at, valid_from, invalid_at (microsecond UTC validity bounds), superseded_by, invalidation_note, visibility (team|private), mine, conflicts (proposals: approved items of the same kind, topic and visibility that approval would contradict), disputed_by (approved items: pending proposals that challenge them), stale, evidence: [{ file_id, file_name, version_id, current_version_id, session_id, event_key, handoff_id, quote, stale }] }]. Default status=approved (current knowledge, keystone/constraint/decision first); proposed for the review inbox; all adds rejected, superseded and retired history. as_of=<timestamp> returns what was approved knowledge at that moment (cannot be combined with status). q uses the session search planning (without answer pairing). stale is true when a cited file moved past the cited version. Viewer or higher; also /agent/... with files:read."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: status, in: query, schema: { type: string, enum: [approved, proposed, all] } }, { name: kind, in: query, schema: { type: string, enum: [decision, fact, constraint, preference, gotcha, attempt, keystone] } }, { name: q, in: query, schema: { type: string, maxLength: 200 } }, { name: as_of, in: query, schema: { type: string, format: date-time } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }]
      responses:
        "200": { description: "{ items }" }
        "422": { description: invalid_knowledge or invalid_query }
    post:
      operationId: proposeKnowledge
      summary: "Propose { request_id, kind, statement (1-2000 chars, no control characters except newline/tab), topic?, outcome? (required iff kind=attempt: failed|partial|worked), supersedes? (an approved item id), evidence?: up to 10 of { file_id, version_id, quote? } | { session_id, ordinal, quote? } | { handoff_id, quote? }, visibility?: team (default) | private }. Private items are visible to their creator (and that person's assistants) only and are decided by their creator; a correction must target an approved item of the same visibility; cited sessions must be visible to the proposer. Always created as proposed; idempotent per request_id. Editor/owner or files:write agent; also /agent/..."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Proposed item }
        "403": { description: read_only or insufficient_scope }
        "409": { description: request_conflict (request_id reused with different input) }
        "422": { description: invalid_knowledge or unknown_evidence }
  /workspaces/{id}/knowledge/{item}/decision:
    post:
      operationId: decideKnowledge
      summary: "Decision from a web session { decision: approved|rejected, note?, statement?, resolution?: replace|keep_both }: a workspace owner for team items, the creator for private items (404 for anyone else). With statement, approval stores a new approved revision with the same evidence and marks the proposal superseded. Approving a correction supersedes the item it corrects. When the proposal conflicts with approved items, approval requires resolution: replace supersedes them, keep_both keeps them current. Refused when cited file evidence changed since the proposal. No agent route. Also /agent/... with a review:accept key (team proposals by other actors only) or a grand key; assistants never decide private items; 403 otherwise."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: item, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The decided (or newly approved) item }
        "403": { description: owner_required }
        "404": { description: not_found }
        "409": { description: stale_evidence, already_decided or conflict_unresolved }
        "422": { description: invalid_knowledge }
  /workspaces/{id}/knowledge/{item}/retire:
    post:
      operationId: retireKnowledge
      summary: "Owner-only (session) { note? }: ends a current approved item without a replacement (status retired, invalid_at set). It stays in status=all history and in as_of recall before that moment. No agent route. Also /agent/... with a grand key."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: item, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The retired item }
        "403": { description: owner_required }
        "404": { description: not_found }
        "409": { description: not_current }
        "422": { description: invalid_knowledge }
  /workspaces/{id}/files/{file}/precheck:
    get:
      operationId: precheckFile
      summary: "What to know before editing one file: { file: { id, name, current_version_id, revision, changed_at, changed_by_agent_id }, knowledge: approved and proposed items citing any version of the file (keystone, constraint, unsuccessful attempts, decisions, others; each with stale), handoffs: up to 5 approved or proposed handoffs citing it [{ id, status, summary, next_step, cited_version_id, stale }], sessions: up to 5 captured sessions whose events contain the exact file name [{ session_id, client, label, ordinal, at, snippet, changed_since }] }. Viewer or higher; also /agent/... with files:read."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: file, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Precheck }
        "404": { description: not_found }
  /workspaces/{id}/sessions/{session}/visibility:
    post:
      operationId: setSessionVisibility
      summary: "{ visibility: private|team }. Only the person who captured the session, from a web session; assistants have no route."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: session, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Changed }
        "404": { description: not_found (missing or not the caller's session) }
        "422": { description: invalid_session }
  /workspaces/{id}/messages:
    get:
      operationId: listMessages
      summary: "Messages in the space, newest first: { messages: [{ id, thread_id, reply_to, from_email, from_agent_id, from_agent_name, to (assistants|owner|agent), to_agent_id, to_agent_name, subject, body, created_at, read_by_me, sources: [{ file_id, file_name, version_id, current_version_id, stale }] }] }. for_me=true: for an assistant, messages to all assistants or to its key that it did not send; for a person, messages to the owner it did not send. unread=true: not yet marked read by this reader. thread=<id>: one conversation. Viewer or higher; also /agent/... with files:read."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: for_me, in: query, schema: { type: boolean } }, { name: unread, in: query, schema: { type: boolean } }, { name: thread, in: query, schema: { type: string, format: uuid } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses:
        "200": { description: "{ messages }" }
    post:
      operationId: sendMessage
      summary: "{ request_id, to: assistants | owner | <name or id of an active assistant key>, body (1-8000 chars), subject?, reply_to?, sources?: up to 10 { file_id, version_id } }. Idempotent per request_id. Editor/owner or files:write agent; also /agent/... A message is coordination, not approved project state."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: The message }
        "403": { description: read_only or insufficient_scope }
        "409": { description: request_conflict }
        "422": { description: invalid_message, unknown_recipient or unknown_reference }
  /workspaces/{id}/messages/read:
    post:
      operationId: markMessagesRead
      summary: "{ ids: up to 100 message ids } -> { marked }. Receipts are per reader: each assistant key, or the person. Viewer or higher; also /agent/... with files:read."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ marked }" }
  /workspaces/{id}/messages/{message}:
    get:
      operationId: getMessage
      summary: One message (same fields as the list). Viewer or higher; also /agent/... with files:read.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: message, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The message }
        "404": { description: not_found }
  /workspaces/{id}/artifacts:
    get:
      operationId: listArtifacts
      summary: "File index (0020). Query: status (all | open | active | kept | removed | missing), due (true = active and past keep_until), host, limit (1-500). -> { artifacts: [{ id, path, host, worktree, branch, purpose, keep_until, status, due, registered_by_email, registered_by_agent_id, registered_by_agent_name, created_at, updated_at, last_checked_at, last_seen_at, closed_at, note }] }. Viewer or higher; also /agent/... with files:read."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ artifacts }" }
        "404": { description: not_found }
        "422": { description: invalid_artifact }
    post:
      operationId: registerArtifact
      summary: "{ path, host?, worktree?, branch?, purpose, keep_until? (RFC 3339) | keep_days? (1-400) } -> the artifact. Neither deadline = needed until someone decides. Registering the same host and path again updates and reactivates it. Editor or higher; also /agent/... with files:write."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: The artifact }
        "403": { description: forbidden }
        "422": { description: invalid_artifact }
  /workspaces/{id}/artifacts/check:
    post:
      operationId: checkArtifacts
      summary: "{ checks: [{ id, exists }] (1-100) } -> { updated }. What a client found on its machine: a missing active file becomes status missing; a present one keeps its status and records last_seen_at. Editor or higher; also /agent/... with files:write."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ updated }" }
        "422": { description: invalid_artifact }
  /workspaces/{id}/artifacts/{artifact}/resolve:
    post:
      operationId: resolveArtifact
      summary: "{ action: keep | extend | removed, keep_until? | keep_days? (extend only, required), note? } -> { status }. Editor or higher; also /agent/... with files:write."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: artifact, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ status }" }
        "404": { description: not_found }
        "422": { description: invalid_artifact }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-aidrive_session }
    agentBearer: { type: http, scheme: bearer, bearerFormat: opaque }
  schemas:
    FileSummary:
      type: object
      required:
      - id
      - name
      - current_version_id
      - byte_size
      properties:
        id:
          type: string
