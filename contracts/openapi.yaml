openapi: 3.1.0
info:
  title: AIDrive API
  version: 0.0.1
  description: Local development sessions, workspaces, revocable agent access, versioned UTF-8 text files, handoffs, activity, desktop pairing, captured assistant sessions and owner-reviewed project knowledge. Provider workflows remain planned.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check that the API process is running
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the API's required dependencies are usable
      description: >-
        Probes PostgreSQL through the runtime role. Not ready when the database is
        unconfigured or unreachable, when the connected role is not aidrive_app,
        has superuser, BYPASSRLS, CREATEDB, CREATEROLE or owner-role membership,
        owns a public table, or required schema objects are missing. This is not
        a complete schema/privilege drift audit. Bodies carry check names only,
        never connection details. File storage is not yet a dependency.
      responses:
        "200":
          description: All checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one check failed; the process itself is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /auth/register:
    post:
      operationId: register
      summary: Create an owner account and start a session (only when AIDRIVE_ALLOW_SIGNUP=1)
      description: State-changing requests require Sec-Fetch-Site same-origin or a matching Origin (ADR 0002).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } } }
      responses:
        "201": { description: Created; sets __Host-aidrive_session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "403": { description: signup_disabled or cross_origin_request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: email_taken, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: invalid_email, password_too_short, password_too_long or password_blocklisted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/login:
    post:
      operationId: login
      summary: Verify credentials and issue a new session token
      description: Passwords are checked in full. Inputs above 256 Unicode characters return invalid_credentials; they are never truncated.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } } }
      responses:
        "200": { description: Signed in; sets __Host-aidrive_session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: invalid_credentials (same response for unknown email), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: cross_origin_request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session server-side and clear the cookie
      responses:
        "204": { description: Signed out }
        "403": { description: cross_origin_request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/session:
    get:
      operationId: getSession
      summary: Return the signed-in user
      responses:
        "200": { description: Active session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces where the signed-in user is a member
      responses:
        "200": { description: Workspaces with the caller's role, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }
        "401": { description: unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: createWorkspace
      summary: Create a workspace owned by the signed-in user
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 120 } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceBody" } } } }
        "401": { description: unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: cross_origin_request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: invalid_name (empty after trimming or over 120 characters), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /workspaces/{id}:
    get:
      operationId: getWorkspace
      summary: Return one workspace the signed-in user belongs to
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Workspace with the caller's role, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceBody" } } } }
        "401": { description: unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: not_found — same response for unknown and foreign workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /workspaces/{id}/agents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAgentGrants
      security: [{ sessionCookie: [] }]
      summary: List access keys for a current owner, without secrets
      responses:
        "200":
          description: Grant metadata; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants: { type: array, items: { $ref: "#/components/schemas/AgentGrant" } }
        "401": { description: Human session required }
        "404": { description: Unknown workspace or caller is not an owner }
        "503": { description: Database unavailable }
    post:
      operationId: issueAgentGrant
      security: [{ sessionCookie: [] }]
      summary: Issue one seven-day workspace or file access key
      description: Requires same-origin CSRF checks. A request UUID is unique; retrying it returns 409 and never reveals the secret again. On ambiguous failure, list keys and revoke an unrecoverable key before replacing it. Scopes are workspace:read, files:read, files:write (role low), review:accept (role medium) and grand (role grand); default workspace:read. Only the space owner issues keys; local trust never issues more than files:write. Extra fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, name]
              properties:
                request_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 120 }
                scope: { type: string, enum: ["workspace:read", "files:read", "files:write", "review:accept", "grand"], default: "workspace:read" }
      responses:
        "201":
          description: One-time secret; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [grant, token]
                properties:
                  grant: { $ref: "#/components/schemas/AgentGrant" }
                  token: { type: string, pattern: '^aidrive_agent_[0-9a-f]{64}$' }
        "401": { description: Human session required }
        "403": { description: Cross-origin request rejected }
        "404": { description: Unknown workspace or caller is not an owner }
        "409": { description: request_already_used; secret cannot be recovered }
        "422": { description: Invalid name, UUID or unsupported fields }
        "503": { description: Creation not confirmed; inspect keys before replacing }
  /workspaces/{id}/agents/{agent}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: agent, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeAgentGrant
      security: [{ sessionCookie: [] }]
      summary: Permanently revoke a workspace key as a current owner
      description: Requires same-origin CSRF checks. Repeated revocation returns 204. Completed revocation prevents subsequent reads; already returned data cannot be recalled.
      responses:
        "204": { description: Revoked, including already revoked keys }
        "401": { description: Human session required }
        "403": { description: Cross-origin request rejected }
        "404": { description: Not owner or grant not in this workspace }
        "503": { description: Revocation not confirmed }
  /agent/workspaces/{id}:
    get:
      operationId: readAgentWorkspace
      security: [{ agentBearer: [] }]
      summary: Read only the bound workspace ID and name using an agent key
      description: Cookie sessions do not authorize this endpoint. Expiry, revocation, workspace binding, scope and the issuing owner's current membership are checked for each read. Owner demotion or departure permanently revokes their grants.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized metadata; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [id, name, agent_id, scope]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  agent_id: { type: string, format: uuid }
                  scope: { type: string, enum: ["workspace:read", "files:read", "files:write", "review:accept", "grand"] }
        "401": { description: Missing, malformed, expired, revoked or wrong-workspace agent token }
        "503": { description: Database unavailable }
  /workspaces/{id}/files:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: humanListFiles
      summary: ListFiles
      description: Human session required; viewer or higher.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Result; Cache-Control no-store and X-Content-Type-Options nosniff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '401':
          description: Invalid or missing credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope, read-only membership or failed CSRF check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or unauthorized workspace/file/version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable; a write may have committed. Retry the identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Exclusive file ID cursor; up to 100 rows.
    post:
      operationId: humanCreateTextFile
      summary: CreateTextFile
      description: Human session required; editor/owner plus same-origin CSRF checks. A request UUID deduplicates
        retries. Same UUID and same input returns the original version without moving the head; different input returns
        request_conflict. Inspect current_version_id before editing a replayed result.
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Result; Cache-Control no-store and X-Content-Type-Options nosniff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
        '401':
          description: Invalid or missing credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope, read-only membership or failed CSRF check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or unauthorized workspace/file/version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable; a write may have committed. Retry the identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: version_conflict or request_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content above 256 KiB, or request body above the framework 2 MiB JSON limit
        '422':
          description: Invalid filename, UUID, text, or unsupported fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextFile'
