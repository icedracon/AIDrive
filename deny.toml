[graph]
all-features = true

[advisories]
ignore = [
    # chrono is unmaintained; it comes only through rmcp/schemars (MCP server)
    # and has no maintained replacement upstream yet. Re-check on rmcp updates.
    { id = "RUSTSEC-2026-0543", reason = "transitive via rmcp; no safe upgrade available" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
