services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AIDRIVE_APP_PASSWORD: aidrive
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aidrive-postgres:/var/lib/postgresql/data
      - ./db:/aidrive/db:ro
      - ./migrations:/aidrive/migrations:ro
      - ./scripts:/aidrive/scripts:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-aidrive.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidrive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aidrive-postgres:
