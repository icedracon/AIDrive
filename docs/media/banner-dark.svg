<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">AIDrive</title>
  <desc id="d">Three assistants, Claude Code, Codex and OpenCode, send their work into one shared, governed workspace.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f5f2e8" fill-opacity=".07"/></pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%"><stop offset="0" stop-color="#6bebaa" stop-opacity=".16"/><stop offset="1" stop-color="#6bebaa" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f5f2e8" stop-opacity=".55"/><stop offset=".45" stop-color="#9fd9b8" stop-opacity=".22"/><stop offset="1" stop-color="#14211b" stop-opacity=".2"/></radialGradient>
    <radialGradient id="orbOn" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#e9fff1" stop-opacity=".75"/><stop offset=".45" stop-color="#6bebaa" stop-opacity=".45"/><stop offset="1" stop-color="#14211b" stop-opacity=".25"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="p1" d="M 884 86 C 960 86 990 140 1048 152"/>
    <path id="p2" d="M 846 176 C 930 176 980 168 1040 166"/>
    <path id="p3" d="M 884 262 C 960 262 990 196 1048 180"/>
  </defs>
  <style>
    .wire { fill:none; stroke:#6bebaa; stroke-opacity:.28; stroke-width:1.4; }
    .packet { fill:#effff5; filter:drop-shadow(0 0 4px #6bebaa); }
    .ring { fill:none; stroke:#6bebaa; stroke-width:1.6; opacity:0; transform-box:fill-box; transform-origin:center; animation:ring 8s cubic-bezier(.23,1,.32,1) infinite; }
    .r2 { animation-delay:2s; } .r3 { animation-delay:4s; }
    @keyframes ring { 0%,19% { opacity:0; transform:scale(1); } 20% { opacity:.7; transform:scale(1); } 34% { opacity:0; transform:scale(1.55); } 100% { opacity:0; } }
    .bob { animation:bob 4s ease-in-out infinite alternate; }
    .b2 { animation-delay:-1.3s; } .b3 { animation-delay:-2.6s; }
    @keyframes bob { from { transform:translateY(-3px); } to { transform:translateY(3px); } }
    .tick { opacity:0; animation:tick 8s ease-out infinite; }
    .t1 { animation-delay:1.7s; } .t2 { animation-delay:3.7s; } .t3 { animation-delay:5.7s; }
    @keyframes tick { 0% { opacity:0; transform:translateX(-6px); } 4% { opacity:1; transform:translateX(0); } 20% { opacity:1; } 26%,100% { opacity:0; } }
    .check { opacity:0; stroke-dasharray:60; stroke-dashoffset:60; animation:check 8s cubic-bezier(.23,1,.32,1) infinite; }
    @keyframes check { 0%,74% { opacity:0; stroke-dashoffset:60; } 76% { opacity:1; } 84% { stroke-dashoffset:0; opacity:1; } 96% { opacity:1; stroke-dashoffset:0; } 100% { opacity:0; stroke-dashoffset:0; } }
    .done { fill:none; stroke:#6bebaa; stroke-width:1.4; opacity:0; transform-box:fill-box; transform-origin:center; animation:done 8s cubic-bezier(.23,1,.32,1) infinite; }
    @keyframes done { 0%,75% { opacity:0; transform:scale(1); } 76% { opacity:.8; } 95% { opacity:0; transform:scale(2.1); } 100% { opacity:0; } }
    .hub { animation:hub 8s ease-out infinite; }
    @keyframes hub { 0%,19% { fill-opacity:.07; } 21% { fill-opacity:.2; } 30%,39% { fill-opacity:.07; } 41% { fill-opacity:.2; } 50%,59% { fill-opacity:.07; } 61% { fill-opacity:.2; } 70%,100% { fill-opacity:.07; } }
    @media (prefers-reduced-motion: reduce) { .ring,.bob,.tick,.check,.done,.hub { animation:none; } .packets { display:none; } .check { opacity:1; stroke-dashoffset:0; } }
  </style>

  <rect width="1280" height="320" fill="#14211b"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#f5f2e8">
    <text x="72" y="152" font-size="88" letter-spacing="-2">AIDrive</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
    <text x="76" y="196" font-size="22" fill="#d6e6db">One governed workspace for Claude Code, Codex and OpenCode.</text>
    <text x="76" y="232" font-size="14" fill="#6bebaa" letter-spacing="2.2">LOCAL · SHARED FILES · DECISIONS · HANDOFFS · CAPTURED SESSIONS</text>
  </g>

  <use href="#p1" class="wire"/><use href="#p2" class="wire"/><use href="#p3" class="wire"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f5f2e8" text-anchor="middle">
    <g class="bob"><circle cx="852" cy="86" r="30" fill="url(#orb)" stroke="#f5f2e8" stroke-opacity=".35"/><text x="852" y="134">Claude Code</text></g>
    <g class="bob b2"><circle cx="814" cy="176" r="30" fill="url(#orbOn)" stroke="#6bebaa" stroke-opacity=".8"/><text x="814" y="224">Codex</text></g>
    <g class="bob b3"><circle cx="852" cy="262" r="30" fill="url(#orb)" stroke="#f5f2e8" stroke-opacity=".35"/><text x="852" y="310">OpenCode</text></g>
  </g>

  <g class="packets">
    <circle r="4.5" class="packet" opacity="0"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" dur="8s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.19;.21;1"/></circle>
    <circle r="4.5" class="packet" opacity="0"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" dur="8s" begin="2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.19;.21;1"/></circle>
    <circle r="4.5" class="packet" opacity="0"><animateMotion dur="8s" begin="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear"><mpath href="#p3"/></animateMotion><animate attributeName="opacity" dur="8s" begin="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.02;.19;.21;1"/></circle>
  </g>

  <g>
    <polygon class="hub" points="1098,166 1074,207.6 1026,207.6 1002,166 1026,124.4 1074,124.4" fill="#6bebaa" fill-opacity=".07" stroke="#6bebaa" stroke-opacity=".75" stroke-width="1.6"/>
    <polygon points="1098,166 1074,207.6 1026,207.6 1002,166 1026,124.4 1074,124.4" fill="none" stroke="#f5f2e8" stroke-opacity=".12" stroke-width="7" filter="url(#soft)"/>
    <circle cx="1050" cy="166" r="48" class="ring"/>
    <circle cx="1050" cy="166" r="48" class="ring r2"/>
    <circle cx="1050" cy="166" r="48" class="ring r3"/>
    <circle cx="1050" cy="166" r="48" class="done"/>
    <path class="check" d="M 1032 167 L 1045 180 L 1070 152" fill="none" stroke="#effff5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#d6e6db">
    <g class="tick t1"><rect x="1120" y="122" width="118" height="24" rx="12" fill="#6bebaa" fill-opacity=".12" stroke="#6bebaa" stroke-opacity=".5"/><text x="1134" y="138">file v2</text></g>
    <g class="tick t2"><rect x="1120" y="154" width="118" height="24" rx="12" fill="#6bebaa" fill-opacity=".12" stroke="#6bebaa" stroke-opacity=".5"/><text x="1134" y="170">decision</text></g>
    <g class="tick t3"><rect x="1120" y="186" width="118" height="24" rx="12" fill="#6bebaa" fill-opacity=".12" stroke="#6bebaa" stroke-opacity=".5"/><text x="1134" y="202">handoff</text></g>
  </g>
</svg>
